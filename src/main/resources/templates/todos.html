<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <h1 class="page-title">やること一覧</h1>

        <p><a class="btn" href="/todos/new">新規登録</a></p>

        <table class="todo-table" th:if="${!#lists.isEmpty(todos)}">
            <thead>
            <tr>
                <th>やること</th>
                <th>ジャンル</th>
                <th>優先度</th>
                <th>期限</th>
                <th>状態</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="todo : ${todos}">
                <td th:text="${todo.title}"></td>
                <td th:text="${todo.category}"></td>
                <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></td>
                <td th:text="${todo.dueDate}"></td>
                <td th:text="${todo.completed ? '完了' : '未完了'}"></td>
            </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>
    </div>
</body>
</html>
