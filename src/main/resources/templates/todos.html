<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <h1 class="page-title">やること一覧</h1>

        <p><a class="btn" href="/todos/new">新規登録</a> <a class="btn sub" href="/calendar">カレンダーで見る</a>
            <a class="btn sub" th:if="${trash == 0}" href="/todos?trash=1">削除したもの</a>
            <a class="btn sub" th:if="${trash == 1}" href="/todos">通常の一覧</a></p>

        <form class="search-bar" method="get" action="/todos">
            <label class="form-label" for="keyword">やることの名前</label>
            <input class="form-input" id="keyword" type="text" name="keyword" th:value="${keyword}">

            <label class="form-label" for="category">ジャンル</label>
            <select class="form-input" id="category" name="category">
                <option value="すべて" th:selected="${category == 'すべて'}">すべて</option>
                <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                <option value="資格" th:selected="${category == '資格'}">資格</option>
                <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
            </select>

            <input type="hidden" name="order" th:value="${order}">
            <button class="btn" type="submit">絞り込む</button>
        </form>

        <p>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc')}">期限が近い順</a>
            &nbsp;
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc')}">期限が遠い順</a>
        </p>

        <table class="todo-table" th:if="${!#lists.isEmpty(todos)}">
            <thead>
            <tr>
                <th>やること</th>
                <th>ジャンル</th>
                <th>優先度</th>
                <th>期限</th>
                <th>状態</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="todo : ${todos}"
                th:attr="data-completed-at=${todo.completedAt}"
                th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(T(java.time.LocalDate).now()) and !todo.completed} ? ' overdue' : ''">
                <td th:text="${todo.title}"></td>
                <td th:text="${todo.category}"></td>
                <td>
                    <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></span>
                    <span class="priority-mark" th:if="${todo.priority == 1}" aria-label="優先度の目印">★</span>
                </td>
                <td th:text="${todo.dueDate}"></td>
                <td th:text="${todo.completed ? '完了' : '未完了'}"></td>
                <td th:if="${trash == 0}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                <td th:if="${trash == 1}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="link" type="submit">元に戻す</button></form></td>
            </tr>
            </tbody>
        </table>

        <nav class="pagination" th:if="${totalPages > 0}" aria-label="Pages">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, page=${pageNumber}, trash=${trash})}"
               th:text="${pageNumber}"
               th:classappend="${pageNumber == page} ? ' current' : ''"></a>
        </nav>

        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>
    </div>
    <script>
        document.querySelectorAll('[data-completed-at]').forEach(row => {
            const completedAt = row.dataset.completedAt;
            if (completedAt && row.cells.length > 4) {
                const date = document.createElement('span');
                date.textContent = ` ${completedAt}`;
                row.cells[4].appendChild(date);
            }
        });
    </script>
</body>
</html>
