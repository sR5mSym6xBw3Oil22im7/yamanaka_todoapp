<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集内容の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">編集内容の確認</h1>

        <p class="confirm-value">やること：<span th:text="${todo.title != null and !#strings.isEmpty(todo.title) ? todo.title : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">メモ：<span th:text="${todo.detail != null and !#strings.isEmpty(todo.detail) ? todo.detail : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category != null and !#strings.isEmpty(todo.category) ? todo.category : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate != null ? todo.dueDate : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">完了：<span th:text="${todo.completed == null or !todo.completed ? '未完了' : '完了'}">未完了</span></p>

        <form th:action="@{/todos/{id}(id=${id})}" th:object="${todo}" method="post">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">
            <input type="hidden" th:field="*{completed}">
            <div class="confirm-actions">
                <button class="btn" type="submit">保存する</button>
                <button class="btn sub" type="submit" formmethod="post" th:formaction="@{/todos/{id}/edit(id=${id})}">書き直す</button>
            </div>
        </form>
    </div>
</body>
</html>
