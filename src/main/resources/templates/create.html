<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やることを登録</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">やることを登録</h1>

        <form th:action="@{/todos/confirm}" th:object="${todo}" method="post">
            <p class="error" th:if="${#fields.hasErrors('*')}" th:errors="*{*}"></p>
            <div class="form-row">
                <label class="form-label" for="title">やること</label>
                <input class="form-input" id="title" type="text" th:field="*{title}">
            </div>
            <div class="form-row">
                <label class="form-label" for="detail">メモ</label>
                <input class="form-input" id="detail" type="text" th:field="*{detail}">
            </div>
            <div class="form-row">
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" th:field="*{category}">
                    <option value="">選択してください</option>
                    <option value="デザイン">デザイン</option>
                    <option value="マーケティング">マーケティング</option>
                    <option value="プログラミング">プログラミング</option>
                    <option value="資格">資格</option>
                    <option value="就職活動">就職活動</option>
                </select>
            </div>
            <div class="form-row">
                <label class="form-label" for="priority">優先度</label>
                <select class="form-input" id="priority" th:field="*{priority}">
                    <option value="">選択してください</option>
                    <option value="1">高</option>
                    <option value="2">中</option>
                    <option value="3">低</option>
                </select>
            </div>
            <div class="form-row">
                <label class="form-label" for="dueDate">期限</label>
                <input class="form-input" id="dueDate" type="date" th:field="*{dueDate}">
            </div>
            <button class="btn" type="submit">確認する</button>
            <a class="btn sub" href="/todos">一覧へ</a>
        </form>
    </div>
</body>
</html>
