<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container calendar-page">
        <h1 class="page-title">[[${year}]]年[[${month}]]月</h1>

        <nav class="calendar-navigation" aria-label="月の移動">
            <a class="btn sub" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
            <a class="btn sub" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
            <a class="btn sub" href="/todos">表で見る</a>
            <a class="btn" href="/todos/new">新規登録</a>
        </nav>

        <table class="calendar-table"
               th:attr="data-from=${#temporals.format(firstDay, 'yyyy-MM-dd')},data-to=${#temporals.format(lastDay, 'yyyy-MM-dd')}">
            <thead>
            <tr>
                <th scope="col">日</th>
                <th scope="col">月</th>
                <th scope="col">火</th>
                <th scope="col">水</th>
                <th scope="col">木</th>
                <th scope="col">金</th>
                <th scope="col">土</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="week : ${calendarWeeks}">
                <th:block th:each="day : ${week}">
                    <td th:if="${day != null}"
                        th:attr="data-date=${#temporals.format(day, 'yyyy-MM-dd')}">
                        <span class="calendar-day-number" th:text="${day.dayOfMonth}"></span>
                    </td>
                    <td th:unless="${day != null}"></td>
                </th:block>
            </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function loadTodos() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/todos?${params}`);
            const todos = await res.json();

            const today = new Date();
            const todayString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            const todosByDate = {};

            todos.forEach(todo => {
                if (!todosByDate[todo.dueDate]) {
                    todosByDate[todo.dueDate] = [];
                }
                todosByDate[todo.dueDate].push(todo);
            });

            Object.entries(todosByDate).forEach(([dueDate, dateTodos]) => {
                const cell = document.querySelector(`[data-date="${dueDate}"]`);
                if (!cell) {
                    return;
                }

                dateTodos.slice(0, 3).forEach(todo => {
                    const todoName = document.createElement('a');
                    todoName.href = `/todos/${todo.id}/edit`;
                    todoName.className = 'link';
                    todoName.textContent = todo.title;
                    if (todo.dueDate < todayString && !todo.completed) {
                        todoName.style.color = '#b91c1c';
                    }
                    cell.appendChild(todoName);
                });

                if (dateTodos.length > 3) {
                    const remaining = document.createElement('div');
                    remaining.textContent = `ほか ${dateTodos.length - 3}件`;
                    cell.appendChild(remaining);
                }
            });
        }

        async function loadHolidays() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/holidays?${params}`);
            const holidays = await res.json();

            if (res.headers.has('X-Holidays-Unavailable')) {
                const message = document.createElement('p');
                message.textContent = '祝日を取れませんでした';
                document.querySelector('main').prepend(message);
            }

            document.querySelectorAll('[data-date]').forEach(cell => {
                const date = new Date(`${cell.dataset.date}T00:00:00`);
                const dayOfWeek = date.getDay();
                const holidayName = holidays[cell.dataset.date];

                if (holidayName) {
                    cell.style.backgroundColor = '#fef3c7';
                    cell.title = holidayName;
                } else if (dayOfWeek === 0) {
                    cell.style.backgroundColor = '#fee2e2';
                } else if (dayOfWeek === 6) {
                    cell.style.backgroundColor = '#dbeafe';
                }
            });
        }

        async function loadWeather() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });

            try {
                const res = await fetch(`/api/weather?${params}`);
                if (!res.ok) {
                    return;
                }
                const weatherByDate = await res.json();
                const weatherLabels = {
                    0: '快晴', 1: '晴れ', 2: 'くもり', 3: '曇天',
                    100: '晴れ', 101: '晴れ時々くもり', 102: '晴れ一時雨', 103: '晴れ時々雨',
                    110: '晴れのちくもり', 111: '晴れのち時々くもり', 112: '晴れのち一時雨',
                    200: 'くもり', 201: 'くもり時々晴れ', 202: 'くもり一時雨', 203: 'くもり時々雨',
                    204: 'くもり一時雪', 210: 'くもりのち晴れ', 211: 'くもりのち時々晴れ',
                    212: 'くもりのち一時雨', 213: 'くもりのち時々雨', 214: 'くもりのち雨',
                    300: '雨', 301: '雨時々晴れ', 302: '雨時々止む', 303: '雨時々雪',
                    400: '雪', 401: '雪時々晴れ', 402: '雪時々止む', 403: '雪時々雨',
                    45: '霧', 48: '霧', 51: '小雨', 53: '小雨', 55: '小雨',
                    61: '雨', 63: '雨', 65: '大雨', 71: '雪', 73: '雪', 75: '大雪',
                    80: 'にわか雨', 81: 'にわか雨', 82: '強いにわか雨',
                    95: '雷雨', 96: '雷雨', 99: '雷雨'
                };

                Object.entries(weatherByDate).forEach(([date, weather]) => {
                    const cell = document.querySelector(`[data-date="${date}"]`);
                    if (!cell || (weather.weatherCode === null && !weather.weatherText)) {
                        return;
                    }
                    const weatherText = document.createElement('div');
                    const label = weather.weatherText || weatherLabels[weather.weatherCode] || '天気';
                    const temperatures = weather.temperatureMax !== null && weather.temperatureMin !== null
                        ? ` ${Math.round(weather.temperatureMax)}℃/${Math.round(weather.temperatureMin)}℃`
                        : '';
                    const precipitation = weather.precipitationProbability !== null
                        ? ` 降水${weather.precipitationProbability}%`
                        : '';
                    weatherText.className = 'calendar-weather';
                    weatherText.textContent = `${label}${temperatures}${precipitation}`;
                    cell.appendChild(weatherText);
                });
            } catch (error) {
                // 天気が取得できなくても、カレンダーと他の情報は表示する。
            }
        }

        loadTodos();
        loadHolidays();
        loadWeather();
    </script>
</body>
</html>
